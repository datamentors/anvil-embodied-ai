# Pi0.5 envelope checkpoint 000500 — real sensors, shadow outputs only.
#
# The task prompt is intentionally null: the inference node must read the exact
# training prompt from pretrained_model/anvil_config.json. The three model camera
# names and their ROS topics match the conversion_config.yaml used for training.

model:
  task_description: null
  require_checkpoint_manifest: true

diagnostics:
  # Acceptance shadow matches the live runtime: no per-forward timestamp or
  # CUDA-event instrumentation. Aggregate latency/FPS and monitor CSV remain.
  rtc_timing: false
  rtc_cuda_events: false

inference_tuning:
  act:
    n_action_steps: null
    temporal_ensemble_coeff: null
  diffusion:
    n_action_steps: null
    num_inference_steps: 10
  rtc:
    inference_delay: 10
    queue_trigger_threshold: 50
    # Diagnostic shadow value. The clean offline A/B measured only ~1.2 ms
    # additional p95 latency versus 12, while preserving substantially more
    # guided overlap. The live candidate uses the same reviewed RTC geometry.
    execution_horizon: 35
    max_guidance_weight: 10.0
    prefix_attention_schedule: EXP
    readiness_guided_forwards: 5
    readiness_latency_guard_steps: 2
    readiness_index_phase_tolerance_steps: 1
    readiness_scheduler_guard_steps: 1
    readiness_min_guided_overlap_steps: 3

joint_state_topic: "/joint_states"

joint_names:
  # Per-arm order. arm_mapping is sorted as l, r, yielding the checkpoint's
  # full 16-dimensional left-first then right order.
  model_joint_order:
    - finger_joint1
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
  controller_joint_order:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
    - finger_joint1
  observation_prefix: follower
  separator: "_"
  arm_mapping:
    l: left
    r: right
  state_features:
    - position

arms:
  left:
    ros_prefix: "follower_l"
    command_topic: "/debug/follower_l_forward_position_controller/commands"
    action_start: 0
    action_end: 8
  right:
    ros_prefix: "follower_r"
    command_topic: "/debug/follower_r_forward_position_controller/commands"
    action_start: 8
    action_end: 16

cameras:
  # Sensors publish near 60 Hz; inference/control remains 30 Hz.
  fps: 60.0
  mapping:
    "/cam_chest/image_raw/compressed": "base"
    "/cam_wrist_l/image_raw/compressed": "left_wrist"
    "/cam_wrist_r/image_raw/compressed": "right_wrist"

safety:
  # Absolute actions; clamp each command against current measured positions.
  max_position_delta: 0.04
  min_position_delta: null
  joint_limit_tolerance: 0.000001
  # Diagnostic shadow margins only. The train-ready data reaches up to
  # 15.9 mrad below several URDF lower bounds, and the first joint-worker
  # shadow produced left_joint5=-1.579111. Every accepted target is clipped
  # back to the hard URDF bound before delta limiting. The runtime rejects
  # revolute margins if any command topic is not under /debug/.
  joint_limit_saturation_margins:
    follower_l_finger_joint1: [0.01, 0.01]
    follower_r_finger_joint1: [0.01, 0.01]
    follower_l_joint3: [0.03, 0.0]
    follower_l_joint5: [0.02, 0.0]
    follower_l_joint6: [0.12, 0.0]
    follower_l_joint7: [0.025, 0.0]
    follower_r_joint2: [0.005, 0.0]
    follower_r_joint6: [0.005, 0.0]
  # Hard URDF bounds from the Devbox controller description. Keys are the
  # complete ROS joint names generated by ros_prefix + controller_joint_order.
  joint_position_limits:
    follower_l_joint1: [-2.3562, 2.3562]
    follower_l_joint2: [-3.3161, 0.1745]
    follower_l_joint3: [-1.570796, 1.570796]
    follower_l_joint4: [0.0, 2.443461]
    follower_l_joint5: [-1.570796, 1.570796]
    follower_l_joint6: [-0.785398, 0.785398]
    follower_l_joint7: [-1.570796, 1.570796]
    follower_l_finger_joint1: [0.0, 0.05]
    follower_r_joint1: [-2.3562, 2.3562]
    follower_r_joint2: [-0.1745, 3.3161]
    follower_r_joint3: [-1.570796, 1.570796]
    follower_r_joint4: [0.0, 2.443461]
    follower_r_joint5: [-1.570796, 1.570796]
    follower_r_joint6: [-0.785398, 0.785398]
    follower_r_joint7: [-1.570796, 1.570796]
    follower_r_finger_joint1: [0.0, 0.05]

watchdog:
  camera_timeout_sec: 0.25
  joint_state_timeout_sec: 0.10
  # The base JPEG stream has shown isolated 106-119 ms processing gaps while
  # remaining fresh and near 57-60 Hz. Keep the skew gate below the 250 ms
  # camera timeout, but avoid latching on the previously measured 100 ms edge.
  max_sensor_skew_sec: 0.12
  # Previous real-input Pi0.5 runs reached ~0.55-0.59 s inference latency.
  # Keep sensor freshness strict while allowing an in-flight RTC result.
  max_action_age_sec: 1.65
  startup_grace_sec: 10.0
