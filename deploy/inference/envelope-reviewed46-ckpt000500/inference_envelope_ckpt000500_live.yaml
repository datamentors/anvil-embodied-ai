# Pi0.5 envelope checkpoint 000500 — LIVE ROBOT COMMAND TOPICS.
#
# Do not invoke this file directly. run_live.sh enforces an explicit two-part
# confirmation. Complete echo-only and shadow-mode checks first.

model:
  task_description: null
  require_checkpoint_manifest: true

diagnostics:
  rtc_timing: false
  rtc_cuda_events: false

runtime:
  # The isolated worker is the measured fix for the 500 Hz JointState callback
  # starving Pi0.5 launches in the main Python process. The runner still has to
  # opt in with joint_state_worker:=true.
  allow_live_joint_state_worker: true

inference_tuning:
  act:
    n_action_steps: null
    temporal_ensemble_coeff: null
  diffusion:
    n_action_steps: null
    num_inference_steps: 10
  rtc:
    inference_delay: 10
    queue_trigger_threshold: 50
    # H=25 is the configuration validated by the real-sensor joint-worker
    # shadows. H=12 does not retain enough guided overlap at measured latency.
    execution_horizon: 35
    max_guidance_weight: 10.0
    prefix_attention_schedule: EXP
    readiness_guided_forwards: 5
    readiness_latency_guard_steps: 2
    readiness_index_phase_tolerance_steps: 1
    readiness_scheduler_guard_steps: 1
    readiness_min_guided_overlap_steps: 3

joint_state_topic: "/joint_states"

joint_names:
  model_joint_order:
    - finger_joint1
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
  controller_joint_order:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
    - finger_joint1
  observation_prefix: follower
  separator: "_"
  arm_mapping:
    l: left
    r: right
  state_features:
    - position

arms:
  left:
    ros_prefix: "follower_l"
    command_topic: "/follower_l_forward_position_controller/commands"
    action_start: 0
    action_end: 8
  right:
    ros_prefix: "follower_r"
    command_topic: "/follower_r_forward_position_controller/commands"
    action_start: 8
    action_end: 16

cameras:
  fps: 60.0
  mapping:
    "/cam_chest/image_raw/compressed": "base"
    "/cam_wrist_l/image_raw/compressed": "left_wrist"
    "/cam_wrist_r/image_raw/compressed": "right_wrist"

safety:
  # Short diagnostic run: nominal target-slope bound 0.60 rad/s at 30 Hz.
  # Hard absolute URDF limits below remain enforced for every published target.
  max_position_delta: 0.02
  min_position_delta: null
  joint_limit_tolerance: 0.000001
  # Explicit operator-approved relaxation of the raw-model gate. Accepted
  # values are clipped back to the hard URDF bounds before delta limiting; the
  # limits below are never expanded.
  allow_live_joint_limit_saturation: true
  # Diagnostic-only: arbitrary raw VLA overshoot is clipped to the hard URDF
  # range before delta limiting. This does not expand any published limit.
  saturate_all_raw_targets_to_joint_limits: true
  joint_limit_saturation_margins: {}
  # Hard URDF bounds from the Devbox controller description. Keys are the
  # complete ROS joint names generated by ros_prefix + controller_joint_order.
  joint_position_limits:
    follower_l_joint1: [-2.3562, 2.3562]
    follower_l_joint2: [-3.3161, 0.1745]
    follower_l_joint3: [-1.570796, 1.570796]
    follower_l_joint4: [0.0, 2.443461]
    follower_l_joint5: [-1.570796, 1.570796]
    follower_l_joint6: [-0.785398, 0.785398]
    follower_l_joint7: [-1.570796, 1.570796]
    follower_l_finger_joint1: [0.0, 0.05]
    follower_r_joint1: [-2.3562, 2.3562]
    follower_r_joint2: [-0.1745, 3.3161]
    follower_r_joint3: [-1.570796, 1.570796]
    follower_r_joint4: [0.0, 2.443461]
    follower_r_joint5: [-1.570796, 1.570796]
    follower_r_joint6: [-0.785398, 0.785398]
    follower_r_joint7: [-1.570796, 1.570796]
    follower_r_finger_joint1: [0.0, 0.05]

watchdog:
  camera_timeout_sec: 0.25
  joint_state_timeout_sec: 0.10
  # Matches the reviewed real-sensor shadow gate; camera freshness remains
  # independently limited to 250 ms.
  max_sensor_skew_sec: 0.12
  # Previous real-input Pi0.5 runs reached ~0.55-0.59 s inference latency.
  # Keep sensor freshness strict while allowing an in-flight RTC result.
  max_action_age_sec: 1.65
  startup_grace_sec: 10.0
